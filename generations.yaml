generations:
  - name: "First Generation"
    start_year: 2017
    end_year: 2020
    description: "The Chrysler Pacifica Hybrid (technically a plug-in hybrid despite the simplified naming) was the first electrified minivan in the American market. Based on the standard Pacifica, it combines a modified version of the 3.6L Pentastar V6 engine with a dual-motor eFlite electrically variable transmission and a 16 kWh lithium-ion battery pack mounted under the floor. This system delivers a combined 260 HP and an all-electric range of approximately 32-33 miles before the gasoline engine engages, with a total range of over 500 miles. The battery can be fully charged in approximately 2 hours using a 240-volt Level 2 charger or about 14 hours with a standard household outlet. Unlike the regular Pacifica, the Hybrid model doesn't offer Stow 'n Go second-row seats (as the battery occupies that underfloor space), though it maintains the fold-flat third row. Interior appointments and available technology closely match the conventional Pacifica, including the Uconnect Theater rear entertainment system and advanced safety features. The Pacifica Hybrid qualifies for federal tax incentives and various state rebates, making it an attractive option for environmentally conscious families seeking minivan practicality with significantly improved fuel efficiency."
  - name: "First Generation (2021 Facelift)"
    start_year: 2021
    end_year: null
    description: "A restyled 2021 Chrysler Pacifica marked a significant refresh of the plug-in hybrid variant. The facelift introduced new exterior styling, new Uconnect 5 infotainment system with a standard 10.1-inch high-resolution touchscreen display, wireless Apple CarPlay and Android Auto smartphone integration, Amazon Alexa capabilities, and SiriusXM Satellite Radio with high-speed data connectivity. USB-C high-speed data and charging ports became standard. The FamCam rear camera system displays an image of rear passengers. A new Pinnacle trim level was introduced with unique leather seat trim and quilted leather pillows for second-row seats. The Pacifica Hybrid remains front-wheel drive only (unlike the gasoline model which gained AWD in 2020), with the 16 kWh lithium-ion battery pack and 33-mile electric range continuing. EPA-estimated fuel economy of 82-84 MPGe in combined electric/gasoline operation represents exceptional efficiency for a seven-passenger vehicle."
